server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    root /var/www/html;

    error_log /var/log/nginx/tmbo-error.log;
    access_log /var/log/nginx/tmbo-access.log combined;

    index index.php index.html index.htm;
    client_max_body_size 20M;

    # Health check endpoint for nginx
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # PHP-FPM status endpoint
    location /fpm_status {
        access_log off;
        include fastcgi_params;
        fastcgi_pass php:9000;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html /index.php;
    }

    location /offensive {
        error_page 404 /offensive/404.php;
        error_page 403 /offensive/403.php;
    }

    # Block access to admin directory
    location /admin {
        return 403;
    }

    # Pass PHP scripts to PHP-FPM via TCP
    location ~ \.php(/.+)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Image hotlink protection (disabled for development)
    # location ~* [^(tmbologo)]\.(jpe?g|gif|png)$ {
    #     valid_referers none blocked *.tmbo.org tmbo.org localhost;
    #     if ($invalid_referer) {
    #         rewrite ^ /tmbologo.gif;
    #     }
    # }

    # Deny access to dotfiles.
    #
    # The webroot is a bind mount of the repository itself, so /.git was being
    # served: /.git/config, /.git/HEAD and /.git/index all returned 200, which is
    # enough to reconstruct the full source history. This also covers .env, editor
    # swap files, and anything else that starts with a dot.
    #
    # .well-known is exempted so ACME/cert renewal keeps working.
    location ~ /\.well-known/ {
        allow all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Realtime WebSocket proxy to Node.js service
    location /socket.io {
        proxy_pass http://realtime:1337/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/tmbo.pem;
    ssl_certificate_key /etc/ssl/private/tmbo.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
}
