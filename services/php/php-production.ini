; Production PHP overrides.
;
; Loaded from the conf.d directory AFTER php.ini, so these win over the
; development values baked into the image. Mounted by docker-compose.prod.yml;
; development is untouched and keeps its visible errors.
;
; The base php.ini stays development-friendly on purpose: display_errors is
; genuinely useful locally, and this file is what makes it safe to ship the same
; image to production.

; Don't advertise the PHP version in headers or via ?=PHPE9568F...
expose_php = Off

; Never render errors into the response. The site calls trigger_error() with
; E_USER_ERROR on a missing auth secret (see tmbo_secret in functions.inc), and
; that path can otherwise print config details straight to the browser. Log
; instead: stderr is picked up by the container runtime.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Backtraces can carry query fragments and secrets; 1024 was truncating them
; mid-message in the log, which made real errors hard to read.
log_errors_max_len = 4096

; Reject session IDs the server never issued, which is the fixation primitive.
session.use_strict_mode = 1

; Keep session cookies away from JavaScript and off plaintext connections.
; The application also sets these at runtime; this is the floor.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
